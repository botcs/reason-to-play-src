program: agents.lrm.play
method: grid
name: twelfth-slice-all-games-all-models-defaults
parameters:
  harness.rationale_mode:
    value: copied-reasoning
  harness.suggestion_level:
    value: elaborate
  harness.context_usage_fraction:
    value: 0.3
  llm.model:
    values:
    - qwen/qwen3.5-9b
    - qwen/qwen3.5-27b
    - qwen/qwen3.5-35b-a3b
    - qwen/qwen3.5-122b-a10b
    - qwen/qwen3.5-397b-a17b
    - deepseek/deepseek-v3.2
  llm.backend:
    value: openrouter
  llm.max_tokens:
    value: 16384
  llm.api_budget:
    value: 45.0
  seed:
    value: 0
  game.game:
    values:
    - avoidGeorge_vgfmri4
    - bait_vgfmri3
    - bait_vgfmri4
    - chase_vgfmri3
    - chase_vgfmri4
    - helper_vgfmri3
    - helper_vgfmri4
    - lemmings_vgfmri3
    - lemmings_vgfmri4
    - plaqueAttack_vgfmri3
    - zelda_vgfmri3
    - zelda_vgfmri4
  game.max_levels:
    value: 9
  game.advancement.strategy:
    value: blocked_curricula
  game.advancement.total_frame_budget:
    value: 4500
  game.advancement.consecutive_wins_required:
    value: 2
  game.advancement.max_consecutive_losses:
    value: 7
  game.idle_frames:
    value: 3
  logging.wandb_project:
    value: <WANDB-PROJECT>
command:
- ${env}
- python
- -m
- agents.lrm.play
- ${args_no_hyphens}
