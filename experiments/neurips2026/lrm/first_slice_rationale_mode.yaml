program: agents.lrm.play
method: grid
name: first-slice-rationale-mode
parameters:
  harness.rationale_mode:
    values:
    - action-only
    - prompted-rationale
    - copied-reasoning
  harness.suggestion_level:
    value: elaborate
  llm.model:
    value: qwen/qwen3.5-9b
  llm.backend:
    value: openrouter
  seed:
    value: 0
  game.game:
    values:
    - bait_vgfmri4
    - chase_vgfmri3
    - zelda_vgfmri4
    - plaqueAttack_vgfmri3
  game.max_levels:
    value: 9
  game.advancement.strategy:
    value: blocked_curricula
  game.advancement.total_frame_budget:
    value: 2700
  game.advancement.consecutive_wins_required:
    value: 2
  game.idle_frames:
    value: 3
  logging.wandb_project:
    value: <WANDB-PROJECT>
command:
- ${env}
- python
- -m
- agents.lrm.play
- ${args_no_hyphens}
