program: agents.lrm.play
method: grid
name: third-slice-zelda-vgfmri4-MED-and-XL-models
parameters:
  harness.rationale_mode:
    values:
    - action-only
    - prompted-rationale
  harness.suggestion_level:
    value: elaborate
  llm.model:
    values:
    - qwen/qwen3.5-27b
    - deepseek/deepseek-v3.2
  llm.backend:
    value: openrouter
  seed:
    value: 0
  game.game:
    value: zelda_vgfmri4
  game.max_levels:
    value: 9
  game.advancement.strategy:
    value: blocked_curricula
  game.advancement.total_frame_budget:
    value: 4500
  game.advancement.consecutive_wins_required:
    value: 2
  game.advancement.max_consecutive_losses:
    value: 4
  game.idle_frames:
    value: 3
  logging.wandb_project:
    value: <WANDB-PROJECT>
command:
- ${env}
- python
- -m
- agents.lrm.play
- ${args_no_hyphens}
