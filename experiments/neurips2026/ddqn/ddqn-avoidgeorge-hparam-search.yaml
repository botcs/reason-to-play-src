name: ddqn-helper-hparam-search
project: ddqn-vgdl
method: bayes
metric:
  name: level_avg_reward
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 200
program: agents/ddqn/train.py
command:
  - ${env}
  - python
  - -m
  - agents.ddqn.train
  - --game-dir
  - agents/ddqn/environment/training/all_games_original
  - ${args}

parameters:
  game_name:
    value: avoidgeorge
  doubleq:
    value: 1
  level_switch:
    value: sequential
  cuda:
    value: 1
  pretrain:
    value: 0
  test_mode:
    value: 0
  lr:
    values: [1e-5, 2.5e-5, 5e-5, 1e-4, 2.5e-4, 5e-4]
  gamma:
    values: [0.97, 0.985, 0.995, 0.999]
  max_mem:
    values: [100000, 300000, 1000000]
  batch_size:
    values: [32, 64, 128]
  target_update:
    values: [1000, 5000, 10000, 30000]
  eps_decay:
    values: [100000, 300000, 1000000]
  eps_end:
    values: [0.01, 0.02]
  grad_clip:
    values: [0.0, 5.0, 10.0]
  frame_stack_size:
    values: [4, 8]
  random_seed:
    values: [1, 7, 23, 42]
