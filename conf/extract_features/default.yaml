# Hydra defaults for the sliding-window feature extractor.
#
# Usage:
#   python -m src.llm_eval.human_replay.extract_features \
#       prompts=/path/to/session.replay.json.gz \
#       model=Qwen/Qwen3.5-9B
#
# All overrides are flat -- e.g. window_fraction=0.25 overlap=0.25.
#
# Disable hydra's auto-generated output/.hydra directories; the extractor
# manages its own output layout under ``output_dir``.
hydra:
  job:
    chdir: false
  output_subdir: null
  run:
    dir: .

prompts: ???
model: ???
# Pin an immutable HF commit for reproducible new extraction.
model_revision: null
output_dir: out/sliding_window_features
torch_dtype: bfloat16
# window_fraction: Fraction of the model's max context per window.  Generative
# gameplay truncates at harness.context_usage_fraction -- keep these in sync
# manually; they are not formally linked.
window_fraction: 0.3
overlap: 0.5
no_compile: true
wandb_project: ""
verbose: false
# action_compression=true: collapse runs of identical consecutive actions
# before tokenizing.  Drops ~72% of turns on human replays (~3.6x token
# reduction).  Features then have non-uniform time gaps between kept turns.
action_compression: false
# random_init=true: use randomly initialised weights (same architecture)
# instead of pretrained checkpoints.  Ablation baseline.
random_init: false
# ablation_tag: when non-empty, ExpDB routes to the ablation table with
# create-on-claim semantics.  Each ablation defines its own tag.
ablation_tag: ""

# Private experiment tracking is optional and disabled for public reproduction.
exp_db:
    enabled: false
    # Fail on the first bad input. True keeps processing but still exits nonzero
    # after the batch if any session failed; successful outputs are retained.
    continue_on_session_error: false
